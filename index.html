<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5d2b">
<title>KARPACZ – START</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { overflow: hidden; background: #183c28; font-family: system-ui, sans-serif; }
  .start-screen {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background-image: url("tlo.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  /* Przezroczysty obszar dokładnie nad zielonym przyciskiem z grafiki. */
  .start-button {
    position: absolute;
    left: 50%;
    top: 79.5%;
    transform: translate(-50%, -50%);
    width: 66%;
    height: 12%;
    border: 0;
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .start-button:focus-visible {
    outline: 4px solid white;
    outline-offset: 4px;
  }
  @media (max-aspect-ratio: 5/8) {
    .start-screen { background-position: center center; }
    .start-button { width: 70%; top: 79.5%; height: 12%; }
  }
</style>
</head>
<body>
  <main class="start-screen" aria-label="Ekran startowy Karpacz">
    <button class="start-button" type="button" aria-label="Start"
      onclick="startGame()"></button>
  </main>
  <script>
    function startGame() {
      // W kolejnym kroku podłączymy tutaj pierwszy punkt gry.
      alert("Ruszamy na przygodę!");
    }
  </script>
</body>
</html>
