<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b2a">
<title>Tajemnica Karpacza</title>
<style>
:root{--gold:#ffd34e;--green:#218b43;--dark:#14251d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#102719;color:#fff}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{display:none;min-height:100svh}
.screen.active{display:flex}
#startScreen{position:relative;min-height:100svh;background:#183c28 url("tlo.png") center center/cover no-repeat}
#startButton{position:absolute;left:50%;top:79.5%;transform:translate(-50%,-50%);width:70%;height:12%;border:0;border-radius:14px;background:transparent}
#startButton:focus-visible,.hotspot:focus-visible{outline:4px solid #fff;outline-offset:3px}
#mapScreen{align-items:stretch;justify-content:center;position:relative;background:#102719;padding:0;overflow:hidden;height:100svh;min-height:100svh}
.map-frame{position:relative;width:100vw;height:100svh;max-width:100%;line-height:0;flex:0 0 100%}
.map-frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.hotspot{position:absolute;transform:translate(-50%,-50%);width:11%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;z-index:2}
.hotspot.active{box-shadow:inset 0 0 0 2px #f5c84b;background:#f5c84b12}
.hotspot.done{box-shadow:inset 0 0 0 4px #39d66f,0 0 0 2px #123c25;background:#20b95755}
.hotspot.done::after{content:"✓";position:absolute;right:-8%;top:-8%;width:43%;height:43%;border-radius:50%;display:grid;place-items:center;background:#20a84d;color:white;border:2px solid #eaffef;font-size:clamp(12px,3.5vw,22px);font-weight:1000;line-height:1;box-shadow:0 2px 6px #0008}
.hotspot.locked{cursor:not-allowed;filter:grayscale(.35);opacity:.72}
.map-hint{position:fixed;z-index:5;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#10251deF;border:1px solid #ffffff55;border-radius:999px;padding:9px 15px;font-size:12px;white-space:nowrap;box-shadow:0 4px 18px #0006}
#missionScreen{align-items:center;justify-content:center;padding:22px 12px;background:linear-gradient(160deg,#173d2b,#0b2018);overflow:auto}
.mission-card{width:min(100%,480px);background:#f7f2df;color:#26352a;border:5px solid #8c642d;border-radius:22px;padding:12px;box-shadow:0 12px 35px #0008}
.mission-kicker{text-transform:uppercase;letter-spacing:2px;font-weight:900;font-size:11px;color:#8b632c}
.mission-card h1{font-size:25px;line-height:1.1;margin:7px 0 12px}
.mission-image{display:block;width:100%;height:auto;aspect-ratio:1.12/1;object-fit:cover;border-radius:13px;margin:0 0 11px}
.clue{background:#fff8df;border-left:5px solid #e4ae32;border-radius:10px;padding:11px 8px 11px 12px;font-size:14px;line-height:1.35;font-weight:750;margin:10px 0;white-space:pre-line}
.action-row{display:flex;gap:9px;margin-top:13px}
.action{border:0;border-radius:12px;padding:12px 9px;font-weight:800;flex:1;min-width:0;font-size:15px}
.action.primary{background:#207b3d;color:#fff}
.action.secondary{background:#e2e8dc;color:#25392b}
.action:disabled{opacity:.45;cursor:not-allowed}
#photoStatus{font-size:12px;color:#5d6a5d;margin-top:3px;min-height:0;line-height:1.2}
.mission-footer{display:flex;gap:9px;margin-top:7px}
.mission-footer .action{font-size:14px}
.back{background:transparent;border:1px solid #9caa97;color:#344638}
@media(max-width:380px){.mission-card{padding:16px}.mission-footer .action{font-size:13px;padding:11px 6px}.action{font-size:14px}}
#finishScreen{align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(160deg,#245c36,#0b2018)}
.finish-card{max-width:430px}
.finish-card h1{font-size:32px}
.finish-card p{line-height:1.6}
.reset{position:fixed;top:8px;right:8px;z-index:8;border:1px solid #ffffff55;background:#10251dbb;color:#fff;border-radius:20px;padding:7px 10px;font-size:11px}
@media(min-width:700px){#mapScreen{padding:16px}.map-frame{border-radius:14px;overflow:hidden;box-shadow:0 10px 40px #0008}.map-hint{bottom:18px}}
</style>
</head>
<body>
<section id="startScreen" class="screen active" aria-label="Ekran startowy">
  <button id="startButton" aria-label="Start"></button>
</section>

<section id="mapScreen" class="screen" aria-label="Mapa przygody">
  <div class="map-frame">
    <img src="mapa.png" alt="Mapa przygody w Karpaczu z siedmioma punktami trasy">
    <!-- Pozycje punktów dopasowane do numerów na grafice mapa.png -->
    <button class="hotspot" data-point="0" style="left:64.7%;top:29.1%" aria-label="Punkt 1"></button>
    <button class="hotspot" data-point="1" style="left:34.7%;top:35.5%" aria-label="Punkt 2"></button>
    <button class="hotspot" data-point="2" style="left:61.9%;top:44.1%" aria-label="Punkt 3"></button>
    <button class="hotspot" data-point="3" style="left:29.5%;top:52.0%" aria-label="Punkt 4"></button>
    <button class="hotspot" data-point="4" style="left:67.1%;top:59.2%" aria-label="Punkt 5"></button>
    <button class="hotspot" data-point="5" style="left:38.5%;top:69.6%" aria-label="Punkt 6"></button>
    <button class="hotspot" data-point="6" style="left:55.2%;top:82.5%" aria-label="Punkt 7"></button>
  </div>
</section>

<section id="missionScreen" class="screen" aria-label="Misja">
  <div class="mission-card">
    <div class="mission-kicker" id="missionKicker">Misja 1 z 7</div>
    <h1 id="missionTitle">Mostek</h1>
    <img class="mission-image" id="missionImage" src="mostek.png" alt="Zdjęcie miejsca misji">
    <div class="clue" id="missionClue"></div>
    <div class="action-row">
      <button class="action secondary" id="navigateButton">🧭 Nawiguj</button>
      <button class="action secondary" id="addPhotoButton">📷 Dodaj zdjęcie</button>
    </div>
    <input id="photoInput" type="file" accept="image/*" hidden>
    <div id="photoStatus"></div>
    <div class="mission-footer">
      <button class="action back" id="backButton">⬅️ Wróć do mapy</button>
      <button class="action primary" id="completeButton" disabled>✅ Ukończ misję</button>
    </div>
  </div>
</section>

<section id="finishScreen" class="screen">
  <div class="finish-card">
    <div style="font-size:64px">🏆</div>
    <h1>Wyprawa ukończona!</h1>
    <p>Wszystkie 7 punktów odkryte. Brawo, odkrywco! Tajemnica Karpacza rozwiązana!</p>
    <button class="action primary" id="finishMapButton">Zobacz mapę</button>
  </div>
</section>

<button class="reset" id="resetButton" title="Wyczyść postęp">Reset</button>

<script>
const missions = [
 {name:"Mostek", image:"mostek.png", destination:"mostek nad zielonym szlakiem Karpacz", clue:"W miejscu, gdzie rzeka z drogą się krzyżuje\nZnak zielono-żółty szlak pokazuje"},
 {name:"Tama", image:"tama.png", destination:"kamienna tama na Łomniczce Karpacz", clue:"Tutaj kamień na kamieniu się trzyma\nSolidna konstrukcja wodę zatrzyma"},
 {name:"OSP", image:"straz.png", destination:"Ochotnicza Straż Pożarna Karpacz", clue:"Dzielna ekipa co gasi pożary\nJak trudno ich znaleźć aż nie do wiary"},
 {name:"Totem", image:"waloni.png", destination:"Pomnik szlak górniczy Karpacz", clue:"Czy to totem, skąd w Karpaczu Indianie?\nTo Waloni, czas na skarbów szukanie"},
 {name:"Bobslej", image:"bobslej.png", destination:"mizeum sportu i turystyki Karpacz", clue:"Co to? Czy to wózek? Czy może sanie?\nPrzed Tobą teraz bobsleja szukanie"},
 {name:"Kościół", image:"wieza.png", destination:"kościół nawiedzenia nmp Karpacz", clue:"Co to za kopuła między drzewami\nCzy zgadniesz, co góruje nad dachami"},
 {name:"Biedra", image:"biedronka.png", destination:"Biedronka Karpacz centrum", clue:"Teraz już czas na ostatnie zadanie\nGdzie kupimy coś na drugie śniadanie?"}
];
const STORAGE_KEY="tajemnicaKarpacza_postep_v2";
let completed=[];
let selectedIndex=0;
let photoReady=false;
const $=id=>document.getElementById(id);
function loadProgress(){
 try { const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); completed=Array.isArray(saved)?saved.filter(n=>Number.isInteger(n)&&n>=0&&n<7):[]; }
 catch(e){completed=[]}
}
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(completed))}catch(e){}}
function activeIndex(){let i=0;while(i<7&&completed.includes(i))i++;return i}
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0)}
function renderMap(){
 const active=activeIndex();
 document.querySelectorAll(".hotspot").forEach(btn=>{
  const i=Number(btn.dataset.point);
  btn.classList.remove("active","done","locked");
  btn.classList.add(completed.includes(i)?"done":i===active?"active":"locked");
  btn.setAttribute("aria-label",`Punkt ${i+1}: ${completed.includes(i)?"ukończony":i===active?"aktywny":"zablokowany"}`);
 });

}
function openMission(i){
 const active=activeIndex();
 if(i>active){return}
 const isCompleted=completed.includes(i);
 selectedIndex=i;photoReady=false;
 const m=missions[i];
 $("missionKicker").textContent=`Misja ${i+1} z 7`;
 $("missionTitle").textContent=m.name;
 $("missionClue").textContent=m.clue;
 $("missionImage").src=m.image;
 $("missionImage").alt=`${m.name} – zdjęcie punktu trasy`;
 $("photoStatus").textContent=isCompleted?"✅ Ta misja została już ukończona.":"";
 $("completeButton").disabled=isCompleted;
 $("completeButton").textContent=isCompleted?"✅ Misja ukończona":"✅ Ukończ misję";
 $("addPhotoButton").disabled=isCompleted;
 $("navigateButton").disabled=false;
 $("photoInput").value="";
 showScreen("missionScreen");
}
function acceptPhoto(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 if(!file.type.startsWith("image/")){$("photoStatus").textContent="Wybierz plik zdjęcia.";return}
 photoReady=true;
 $("photoStatus").textContent="✓ Zdjęcie dodane";
 $("completeButton").disabled=false;
}
$("startButton").addEventListener("click",()=>{renderMap();showScreen("mapScreen")});
document.querySelectorAll(".hotspot").forEach(btn=>btn.addEventListener("click",()=>openMission(Number(btn.dataset.point))));
$("navigateButton").addEventListener("click",()=>{
 const destination=encodeURIComponent(missions[selectedIndex].destination);
 const url=`https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=walking`;
 window.location.href=url;
});
$("addPhotoButton").addEventListener("click",()=>$("photoInput").click());
$("photoInput").addEventListener("change",acceptPhoto);
$("completeButton").addEventListener("click",()=>{
 if(!photoReady||selectedIndex!==activeIndex())return;
 completed.push(selectedIndex);saveProgress();
 if(activeIndex()>=7){showScreen("finishScreen");return}
 renderMap();showScreen("mapScreen");

});
$("backButton").addEventListener("click",()=>{renderMap();showScreen("mapScreen")});
$("finishMapButton").addEventListener("click",()=>{renderMap();showScreen("mapScreen")});
$("resetButton").addEventListener("click",()=>{
 if(confirm("Czy na pewno wyzerować postęp i zablokować ponownie misje 2–7?")){
  completed=[];saveProgress();renderMap();showScreen("startScreen");
 }
});
loadProgress();
</script>
</body>
</html>
